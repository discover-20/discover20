<style>
/* Single-look brand mockup: colours are set explicitly so it reads the same on any host theme. */
:root{
  color-scheme: light;
  --teal:#1ABABA; --teal-d:#128F8F; --tint:#E3F7F5; --coral:#EF5E5E; --coral-d:#D94A4A;
  --purple:#640A94; --green:#7FB950; --yellow:#E9B934;
  --ink:#17242B; --mut:#5F6D74; --line:#E3EBEC; --bg:#FFFFFF; --soft:#F6FAFA;
  --f-ar:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;
  --f-en:"Nunito","Segoe UI",system-ui,Arial,sans-serif;
  --r:18px; --r-lg:26px;
  --sh:0 4px 18px rgba(23,36,43,.07);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ar);font-size:16.5px;line-height:1.75}
body[dir="ltr"]{font-family:var(--f-en);line-height:1.65}
h1,h2,h3,p{margin:0}
h1,h2{text-wrap:balance;font-weight:800;line-height:1.35}
h2{font-size:clamp(24px,3.2vw,34px)}
h3{font-size:18.5px;font-weight:800;line-height:1.4}
a{color:inherit}
.wrap{max-width:1140px;margin-inline:auto;padding-inline:20px}
section{padding-block:72px;position:relative}
.mut{color:var(--mut)}
.center{text-align:center}
.kicker{font-weight:800;color:var(--teal-d);font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.intro{display:grid;gap:12px;justify-items:center;text-align:center;max-width:720px;margin-inline:auto}

/* review chips: which sections are done */
.chip{position:absolute;inset-block-start:14px;inset-inline-start:14px;z-index:5;display:inline-flex;align-items:center;gap:6px;
  font:700 12px/1 var(--f-en);letter-spacing:.03em;padding:6px 10px;border-radius:999px;background:#fff;color:#8A6D1F;
  border:1px solid #EAD9A6;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.chip.done{color:#3F7024;border-color:#C7E3B3}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--yellow)}
.chip.done::before{background:var(--green)}
.chip.sample{color:#B23A3A;border-color:#F3C1C1}
.chip.sample::before{background:var(--coral)}
header .chip{inset-block-start:auto;inset-block-end:-34px}
body.clean .chip{display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding-inline:30px;
  border-radius:999px;border:0;cursor:pointer;font:inherit;font-weight:800;font-size:16.5px;text-decoration:none;
  background:var(--coral);color:#fff;box-shadow:0 6px 18px rgba(239,94,94,.3);transition:transform .15s,background .15s}
.btn:hover{background:var(--coral-d);transform:translateY(-2px)}
.btn:focus-visible,.lang:focus-visible,.tool button:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
.btn-sm{min-height:44px;padding-inline:22px;font-size:15px}
.btn-line{background:transparent;color:var(--teal-d);border:2px solid var(--teal);box-shadow:none;min-height:44px;font-size:15px;padding-inline:20px}
.btn-line:hover{background:var(--teal);color:#fff}

/* 1 header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:3px solid var(--teal)}
.hrow{display:flex;align-items:center;gap:18px;min-height:72px}
.logo{display:flex;align-items:center;gap:10px;font:900 20px var(--f-en);color:var(--ink);white-space:nowrap}
.logo i{font-style:normal;background:var(--teal);color:#fff;border-radius:10px;width:38px;height:38px;display:grid;place-items:center;font-size:14px}
.logo .lt{display:flex;flex-direction:column;gap:3px;line-height:1.05}
.logo small{font:700 12.5px var(--f-en);color:var(--coral-d);letter-spacing:.03em}
body[dir="rtl"] .logo small{font-family:var(--f-ar);letter-spacing:0}
footer .logo small{color:#7FDADA}
nav{display:flex;gap:24px;margin-inline-start:auto;flex-wrap:wrap}
nav a{text-decoration:none;color:#4A5961;font-size:15.5px;font-weight:600}
nav a:hover{color:var(--teal-d)}
.lang{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 15px;
  font:700 14px var(--f-ar);color:var(--ink);cursor:pointer}
.lang svg{width:16px;height:16px;color:var(--teal-d)}
.hact{display:flex;align-items:center;gap:10px}

/* 2 hero */
.hero{background:var(--teal);color:#fff;padding-block:64px 76px;overflow:hidden}
.herogrid{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(28px,4vw,44px);line-height:1.4}
.hero .sub{margin-block-start:20px;font-size:clamp(16.5px,1.7vw,19px);line-height:1.85;opacity:.95;max-width:48ch}
.hero .btn{margin-block-start:30px}
.ph{border-radius:var(--r-lg);background:linear-gradient(160deg,#F6F7F9,#E4E7EB);min-height:340px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;color:var(--mut);font-size:14px;text-align:center;padding:24px}
.ph span{width:52px;height:52px;border-radius:50%;background:#D6DADF;display:grid;place-items:center}
.ph svg{width:24px;height:24px;color:#8C959C}

/* 3 how it works — 5-step journey */
.how h2{font-size:clamp(26px,3.6vw,40px)}
.hsteps{list-style:none;padding:0;margin:40px 0 0;display:grid;grid-template-columns:repeat(5,1fr);gap:16px;position:relative}
.hsteps::before{content:"";position:absolute;inset-inline:10%;inset-block-start:52px;border-top:2px dashed #BFE9E4;z-index:0}
.hstep{position:relative;z-index:1;background:#fff;border-radius:22px;padding:22px 20px 26px;box-shadow:0 6px 26px rgba(23,36,43,.08);display:flex;flex-direction:column;gap:10px}
.hstep .top{display:flex;justify-content:space-between;align-items:center;margin-block-end:6px}
.hstep .n{font:900 48px/1 var(--f-en);color:#C9F0EC}
.hstep svg{width:30px;height:30px;color:var(--teal)}
.hstep h3{font-size:17.5px}
.hstep p{font-size:15px;line-height:1.75;color:var(--mut)}

/* 20 minutes / young secrets */
.young{background:var(--soft)}
.young h2{font-size:clamp(26px,3.6vw,40px)}
.points{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.points li{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:700;font-size:15px}
.points svg{width:18px;height:18px;color:var(--teal-d)}

/* journal categories */
.cats{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-block-start:8px}
.cats a{text-decoration:none;border:1.5px solid #CFE6E4;border-radius:999px;padding:7px 15px;font-weight:700;font-size:14.5px;color:var(--ink)}
.cats a:hover{border-color:var(--teal);color:var(--teal-d)}

/* 4 assessment library */
.lib{background:#F1FBFA}
.lib h2{font-size:clamp(26px,3.6vw,40px)}
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-block-start:38px}
.acard{background:#fff;border-radius:22px;padding:26px;box-shadow:0 6px 26px rgba(23,36,43,.07);display:flex;flex-direction:column;gap:8px}
.acard svg{width:34px;height:34px;color:var(--teal);margin-block-end:14px}
.acard p{color:var(--mut);font-size:15.5px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-block-start:auto;padding-block-start:18px}
.badge{font:700 13px/1 var(--f-en);padding:8px 13px;border-radius:999px;background:#EEF2F3;color:#3D4B52}
body[dir="rtl"] .badge{font-family:var(--f-ar)}
.badge.free{background:#A6D883;color:#23410F}
.dash{display:flex;gap:14px;align-items:center;max-width:760px;margin:34px auto 0;background:#fff;border:1.5px solid #BFE9E4;
  border-radius:18px;padding:16px 20px;font-weight:700;font-size:16px}
.dash svg{flex:0 0 30px;height:30px;color:var(--teal-d)}
.lib .more{display:flex;justify-content:center;margin-block-start:26px}
.lnote{margin:26px auto 0;max-width:72ch;text-align:center;font-size:13.5px;color:var(--mut);line-height:1.8}

/* 9 cards */
.cardsec h2{font-size:clamp(26px,3.6vw,40px)}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-block-start:38px}
.kcard{background:#fff;border-radius:22px;padding:18px 18px 22px;box-shadow:0 6px 26px rgba(23,36,43,.08);display:flex;flex-direction:column;gap:8px}
.kart{border-radius:18px;height:110px;display:grid;place-items:center;margin-block-end:12px}
.kart span{width:62px;height:62px;border-radius:16px;background:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.kart svg{width:28px;height:28px;color:var(--teal)}
.kcard h3,.kcard p{padding-inline:4px}
.kcard p{color:var(--mut);font-size:15.5px}
.kcard .badge{align-self:flex-start;margin-block-start:auto;margin-inline-start:4px}

/* 10 experts */
.experts h2{font-size:clamp(26px,3.6vw,40px)}
.experts .card .btn{margin-block-start:auto}

/* 11 testimonials */
.voices h2{font-size:clamp(26px,3.6vw,40px)}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-block-start:38px}
.q{background:#fff;border-radius:22px;padding:28px;box-shadow:0 6px 26px rgba(23,36,43,.08);display:flex;flex-direction:column;gap:18px}
.q.sample{outline:2px dashed #F3C1C1;outline-offset:-8px}
.qav{width:64px;height:64px;border-radius:50%;background:var(--tint);color:var(--teal-d);display:grid;place-items:center;font:800 22px var(--f-ar);border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.qt{font-size:18px;font-weight:700;line-height:1.85}
.qwho{margin-block-start:auto;color:var(--mut);font-size:14.5px}
.qwho b{color:var(--ink)}
.science{margin:34px auto 0;max-width:74ch;text-align:center;color:var(--mut);font-size:15px}

/* 12 pricing */
.pricing h2{font-size:clamp(28px,4vw,44px)}
.prtext{font-size:clamp(17px,1.9vw,20px);font-weight:700;line-height:1.9;max-width:58ch}
.pricing .btn{margin-block-start:14px}

/* 14 faq */
.faqsec{background:#F1FBFA}
.faqsec h2{font-size:clamp(28px,4vw,44px)}
.faq{max-width:920px;margin:36px auto 0;background:#fff;border-radius:26px;padding:6px 34px;box-shadow:0 8px 30px rgba(23,36,43,.07)}
.fi+.fi{border-top:1px solid var(--line)}
.fq{width:100%;background:none;border:0;cursor:pointer;font:inherit;font-weight:800;font-size:17px;color:var(--ink);text-align:start;
  padding:24px 0;display:flex;align-items:center;gap:16px}
.fq:hover,.fq[aria-expanded="true"]{color:var(--teal-d)}
.fq svg{width:20px;height:20px;margin-inline-start:auto;flex:0 0 auto;color:var(--mut);transition:transform .2s}
.fq[aria-expanded="true"] svg{transform:rotate(180deg)}
.fq:focus-visible{outline:3px solid var(--purple);outline-offset:2px;border-radius:6px}
.fa p{padding-block-end:22px;color:var(--mut);max-width:70ch}

.about{background:var(--soft)}
.about .wrap{display:grid;gap:18px;max-width:780px;text-align:center;justify-items:center}
.about .big{font-size:clamp(20px,2.4vw,26px);font-weight:800;line-height:1.6}

.tracker .kicker{color:#E7C8FF}
.tracker h2{margin-block:10px 22px}
.tracker p{opacity:.92;font-size:17px}

.dom{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}

.domc .bar b{display:block;height:100%;border-radius:99px}
.prog{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;color:var(--mut);padding-block-start:8px}

.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-block-start:40px}

.card .btn{align-self:flex-start;margin-block-start:auto}
.card p{flex:0}

/* 7 experts */
.experts{background:var(--tint)}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-block-start:40px}

/* 8 journal */
.jgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-block-start:40px}
.jcard{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff;box-shadow:var(--sh)}
.jimg{aspect-ratio:16/10;background:linear-gradient(150deg,var(--tint),#CFEDEA);max-width:100%}
.jbody{padding:14px 16px 18px;display:grid;gap:4px}
.jcat{font-size:12.5px;font-weight:800;color:var(--teal-d)}

/* 9 footer */
footer{background:#10343A;color:#C3D8DB;padding-block:56px 30px;font-size:15px;position:relative}
.fgrid{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:36px}
footer h4{color:#fff;margin:0 0 12px;font-size:16px}
footer .links{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}
footer a{text-decoration:none;color:#C3D8DB}
footer a:hover{color:#fff}
.disc{margin-block-start:30px;padding-block-start:20px;border-top:1px solid rgba(255,255,255,.14);font-size:13.5px;color:#90AFB3}

/* review toolbar */
.tool{position:fixed;inset-block-end:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-end:16px;z-index:60;display:flex;gap:6px;
  background:#17242B;padding:6px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-family:var(--f-en)}
.tool button{background:transparent;color:#fff;border:0;border-radius:999px;padding:8px 14px;font:700 13px var(--f-en);cursor:pointer}
.tool button[aria-pressed="true"]{background:var(--teal)}

@media(max-width:980px){.dom,.g4,.jgrid{grid-template-columns:repeat(2,1fr)}
  .hsteps{grid-template-columns:repeat(2,1fr)} .hsteps::before{display:none}}
@media(max-width:860px){
  .herogrid,.tgrid,.g3,.fgrid,.hsteps,.agrid,.kgrid,.qgrid{grid-template-columns:1fr}
  .ph{min-height:220px;order:-1}
  nav{display:none}
  section{padding-block:56px}
}
@media(max-width:520px){
  .dom,.g4,.jgrid{grid-template-columns:1fr}
  .btn{width:100%}
  .hact .btn-sm{width:auto}
  .faq{padding-inline:18px}
  .logo .lt{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  <section class="tracker" id="s4">${chip(4)}
    <div class="wrap tgrid">
      <div><div class="kicker">${t.tK}</div><h2>${t.tH}</h2><a class="btn" href="#">${t.tBtn}</a></div>
      <p>${t.tP}</p>
    </div>
  </section>

  <section id="s5">${chip(5)}
    <div class="wrap dom">${t.doms.map(d=>`<div class="domc">
      <h3>${d[0]}</h3><p class="mut" style="font-size:15px">${d[1]}</p>
      <div class="prog"><span>${t.progress}</span><span>85%</span></div>
      <div class="bar"><b style="width:85%;background:${d[2]}"></b></div></div>`).join("")}
    </div>
  </section>

  <section class="lib" id="s6">${chip(6)}
    <div class="wrap">
      <div class="intro"><h2>${t.libH}</h2><p class="mut">${t.libS}</p></div>
      <div class="agrid">${t.tests.map((a,i)=>`<div class="acard">
        ${LIBICONS[i]}<h3>${a[0]}</h3><p>${a[1]}</p>
        <div class="badges"><span class="badge">${a[2]}</span><span class="badge">${a[3]} ${t.mins}</span>${a[4]?`<span class="badge free">${t.free}</span>`:""}</div>
      </div>`).join("")}</div>
      <div class="dash">${DASHICON}<span>${t.libDash}</span></div>
      <div class="more"><a class="btn" href="/assessments">${t.libMore} <span aria-hidden="true">${arrow()}</span></a></div>
      <p class="lnote">${t.libNote}</p>
    </div>
  </section>

  <section class="young" id="s7">${chip(7)}
    <div class="wrap">
      <div class="intro"><div class="kicker">${t.yK}</div><h2>${t.yH}</h2><p class="mut">${t.yP}</p>
        <ul class="points">${t.yPts.map(p=>`<li>${CHECK}${p}</li>`).join("")}</ul></div>
      <div class="g3">${t.secrets.map(s=>`<div class="card">
        <span class="lbl" style="background:${s[3]}1f;color:${s[3]}">${s[0]}</span>
        <h3>${s[1]}</h3><p class="mut">${s[2]}</p>
        <a class="btn btn-line" href="#">${s[4]}</a></div>`).join("")}</div>
    </div>
  </section>

  <section class="cardsec" id="s8">${chip(8)}
    <div class="wrap">
      <div class="intro"><h2>${t.kH}</h2><p class="mut">${t.kS}</p></div>
      <div class="kgrid">${t.kits.map((k,i)=>`<div class="kcard">
        <div class="kart" style="background:${KITBG[i]}"><span>${KITICONS[i]}</span></div>
        <h3>${k[0]}</h3><p>${k[1]}</p>
        <span class="badge">${t.age} ${k[2]}</span></div>`).join("")}</div>
      <div class="center" style="margin-block-start:34px"><a class="btn btn-line" href="/cards">${t.kBtn} <span aria-hidden="true">${arrow()}</span></a></div>
    </div>
  </section>

  <section class="experts" id="s9">${chip(9)}
    <div class="wrap">
      <div class="intro"><div class="kicker">${t.eK}</div><h2>${t.eH}</h2><p class="mut">${t.eP}</p></div>
      <div class="g4">${t.experts.map(e=>`<div class="card">
        <h3>${e[0]}</h3><p class="mut" style="font-size:15px">${e[1]}</p>
        <a class="btn btn-sm" href="#">${t.eBtn}</a></div>`).join("")}</div>
    </div>
  </section>

  <section class="voices" id="s10">${chip(10)}
    <div class="wrap">
      <div class="intro"><div class="kicker">${t.vK}</div><h2>${t.vH}</h2></div>
      <div class="qgrid">${t.voices.map(v=>`<figure class="q sample" style="margin:0">
        <div class="qav" aria-hidden="true">${v[1].charAt(0)}</div>
        <blockquote class="qt" style="margin:0">${v[0]}</blockquote>
        <figcaption class="qwho"><b>${v[1]}</b>${L==="ar"?"، ":", "}${v[2]}</figcaption></figure>`).join("")}</div>
      <p class="science">${t.science}</p>
    </div>
  </section>

  <section class="pricing" id="s11">${chip(11)}
    <div class="wrap intro">
      <h2>${t.prH}</h2>
      <p class="prtext">${t.prP}</p>
      <a class="btn" href="#">${t.cta} <span aria-hidden="true">${arrow()}</span></a>
    </div>
  </section>

  <section id="s12">${chip(12)}
    <div class="wrap">
      <div class="intro"><div class="kicker">${t.jK}</div><h2>${t.jH}</h2><p class="mut">${t.jP}</p>
        <div class="cats">${t.jCats.map(c=>`<a href="#">${c}</a>`).join("")}</div></div>
      <div class="jgrid">${t.posts.map(p=>`<a class="jcard" href="#" style="text-decoration:none">
        <div class="jimg"></div><div class="jbody"><span class="jcat">${p[0]}</span><h3 style="font-size:16.5px">${p[1]}</h3></div></a>`).join("")}</div>
      <div class="center" style="margin-block-start:34px"><a class="btn btn-line" href="#">${t.jBtn}</a></div>
    </div>
  </section>

  <section class="faqsec" id="s13">${chip(13)}
    <div class="wrap">
      <h2 class="center">${t.qH}</h2>
      <div class="faq">${t.faq.map((f,i)=>`<div class="fi">
        <button class="fq" type="button" id="fq${i}" aria-expanded="false" aria-controls="fa${i}">${f[0]}${CHEV}</button>
        <div class="fa" id="fa${i}" role="region" aria-labelledby="fq${i}" hidden><p>${f[1]}</p></div></div>`).join("")}</div>
    </div>
  </section>

  <section class="final" id="s14">${chip(14)}
    <div class="wrap intro">
      <h2>${t.finH}</h2>
      <a class="btn" href="#">${t.cta} <span aria-hidden="true">${arrow()}</span></a>
    </div>
  </section>

  <footer id="s15">${chip(15)}
    <div class="wrap">
      <div class="fgrid">
        <div><div class="logo" style="color:#fff;margin-block-end:12px"><i>D20</i><span class="lt"><span>Discover20</span><small>${t.slogan}</small></span></div><p style="max-width:40ch">${t.fTag}</p></div>
        <div><h4>${t.fQuick}</h4><div class="links">${t.fLinks.map(l=>`<a href="#">${l}</a>`).join("")}</div></div>
        <div><h4>${t.fContact}</h4><p>info@discover20.com</p></div>
      </div>
      <p class="disc">${t.disc} · © 2026 Discover20</p>
    </div>
  </footer>`;
  document.querySelector("header").insertAdjacentHTML("afterbegin","");
  const old=document.querySelector("header .chip"); if(old) old.remove();
  document.querySelector("header").insertAdjacentHTML("afterbegin",chip(1));
}

function setLang(l){ L=l; try{localStorage.setItem("d20-lang",l);}catch(e){} render(); }
$("#app").addEventListener("click",e=>{
  const b=e.target.closest(".fq"); if(!b) return;
  const open=b.getAttribute("aria-expanded")==="true";
  document.querySelectorAll(".fq").forEach(x=>{x.setAttribute("aria-expanded","false"); $("#"+x.getAttribute("aria-controls")).hidden=true;});
  if(!open){ b.setAttribute("aria-expanded","true"); $("#"+b.getAttribute("aria-controls")).hidden=false; }
});
$("#lang").onclick=()=>setLang(L==="ar"?"en":"ar");
$("#tAr").onclick=()=>setLang("ar");
$("#tEn").onclick=()=>setLang("en");
$("#tChips").onclick=e=>{ const on=document.body.classList.toggle("clean"); e.currentTarget.setAttribute("aria-pressed",!on); };
render();
</script>

</body></html>
