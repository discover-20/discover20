<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--d20-font-display)}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--d20-grey-70);margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:var(--d20-teal-light)}
.chip svg{width:36px;height:36px}
.chip.coral{background:var(--d20-coral-light)}
.chip.purple{background:var(--d20-purple-light)}
.chip.yellow{background:var(--d20-yellow-light)}
.chip.green{background:var(--d20-green-light)}
.note{margin-top:14px;font-size:11px;color:var(--d20-grey-50);line-height:1.6}
</style></head><body>
<div class="lbl">Proprietary line-icon set · rounded · single-color · brand-five palette</div>
<div class="row">
  <div class="chip"><img src="../assets/icon-rocket.svg" style="width:38px;height:38px"></div>
  <!-- Rounded stylized icons; stand-ins drawn in brand stroke style -->
  <div class="chip coral"><svg viewBox="0 0 48 48" fill="none" stroke="#F05E5E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="14" width="32" height="22" rx="5"/><path d="M14 14V10M34 14V10M8 22h32"/></svg></div>
  <div class="chip purple"><svg viewBox="0 0 48 48" fill="none" stroke="#5A30CE" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12h22a4 4 0 014 4v18a4 4 0 01-4 4H14l-4 4z"/><path d="M16 22h14M16 28h10"/></svg></div>
  <div class="chip yellow"><svg viewBox="0 0 48 48" fill="none" stroke="#C99800" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="20" r="6"/><path d="M14 38c0-6 4.5-10 10-10s10 4 10 10"/></svg></div>
  <div class="chip green"><svg viewBox="0 0 48 48" fill="none" stroke="#5E9B3A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="16" width="14" height="14" rx="3"/><rect x="26" y="16" width="14" height="14" rx="3"/><rect x="17" y="32" width="14" height="14" rx="3"/></svg></div>
</div>
<div class="note">Stand-ins for chevrons / utility icons use <b>Phosphor Icons</b> (rounded). Always flag substitutions.</div>
</body></html>
