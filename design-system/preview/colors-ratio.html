<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--d20-font-display)}
.bar{display:flex;height:80px;border-radius:14px;overflow:hidden;box-shadow:var(--d20-shadow-sm)}
.seg{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:14px}
.seg.dark{color:var(--d20-black)}
.legend{margin-top:14px;font-size:12px;color:var(--d20-grey-70);line-height:1.6}
.legend b{color:var(--d20-grey-90)}
</style></head><body>
<div class="bar">
  <div class="seg" style="flex:40;background:var(--d20-teal)">40% Teal</div>
  <div class="seg dark" style="flex:15;background:var(--d20-yellow)">15%</div>
  <div class="seg" style="flex:15;background:var(--d20-purple)">15%</div>
  <div class="seg" style="flex:15;background:var(--d20-coral)">15%</div>
  <div class="seg" style="flex:15;background:var(--d20-green)">15%</div>
</div>
<div class="legend"><b>Brand-book ratio (p.16):</b> 40% primary + 15% each of the other four. Swap which color is primary per surface — never let two saturated colors fight for hero space.</div>
</body></html>
