<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">

  <div class="exp" style="background:var(--d20-purple-light);color:var(--d20-purple-dark)"><span class="count">+10</span><span>Psychological Experts</span></div>
  <div class="exp" style="background:var(--d20-teal-light);color:var(--d20-teal-dark)"><span class="count">+5</span><span>Parenting Coaches</span></div>
  <div class="exp" style="background:var(--d20-coral-light);color:var(--d20-coral-dark)"><span class="count">+2</span><span>Development Experts</span></div>
