<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--d20-font-display)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:#fff;border:1px solid var(--d20-grey-15);border-radius:16px;padding:18px 14px;text-align:center;border-top:3px solid var(--d20-teal)}
.stat .n{font-size:30px;font-weight:900;line-height:1;letter-spacing:-.02em}
.stat .l{font-size:11px;font-weight:800;margin-top:6px;color:var(--d20-grey-90)}
</style></head><body>
<div class="grid">
  <div class="stat" style="border-top-color:var(--d20-teal)"><div class="n" style="color:var(--d20-teal)">+500</div><div class="l">Activities</div></div>
  <div class="stat" style="border-top-color:var(--d20-coral)"><div class="n" style="color:var(--d20-coral)">+200</div><div class="l">Developmental Toys</div></div>
  <div class="stat" style="border-top-color:var(--d20-purple)"><div class="n" style="color:var(--d20-purple)">+300</div><div class="l">Moral Stories</div></div>
  <div class="stat" style="border-top-color:var(--d20-yellow)"><div class="n" style="color:#92700A">+5</div><div class="l">Assessments</div></div>
</div>
</body></html>
