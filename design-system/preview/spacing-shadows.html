<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:36px 28px;background:var(--d20-grey-04);font-family:var(--d20-font-display)}
.row{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap}
.card{width:96px;height:80px;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--d20-grey-70);font-size:11px}
.t{font-size:10px;color:var(--d20-grey-50);font-weight:700;letter-spacing:.05em;margin-top:8px;text-align:center}
.col{display:flex;flex-direction:column;align-items:center}
</style></head><body>
<div class="row">
  <div class="col"><div class="card" style="box-shadow:var(--d20-shadow-sm)">sm</div><div class="t">subtle border</div></div>
  <div class="col"><div class="card" style="box-shadow:var(--d20-shadow-md)">md</div><div class="t">cards at rest</div></div>
  <div class="col"><div class="card" style="box-shadow:var(--d20-shadow-lg)">lg</div><div class="t">card hover</div></div>
  <div class="col"><div class="card" style="box-shadow:var(--d20-shadow-xl)">xl</div><div class="t">modal / popover</div></div>
  <div class="col"><div class="card" style="box-shadow:var(--d20-shadow-brand);background:var(--d20-teal);color:#fff">brand</div><div class="t">primary CTA</div></div>
</div>
</body></html>
