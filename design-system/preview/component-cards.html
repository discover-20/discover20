<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--d20-grey-04);font-family:var(--d20-font-display)}
.row{display:flex;gap:14px;align-items:stretch}
.card{flex:1;background:#fff;border:1px solid var(--d20-grey-15);border-radius:18px;padding:18px;box-shadow:var(--d20-shadow-md)}
.accent-coral{border-left:5px solid var(--d20-coral)}
.accent-teal{border-left:5px solid var(--d20-teal)}
.accent-purple{border-left:5px solid var(--d20-purple)}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:8px;margin-bottom:8px}
h4{margin:0 0 4px;font-size:14px;font-weight:900;color:var(--d20-grey-90)}
p{margin:0;font-size:12px;line-height:1.55;color:var(--d20-grey-70)}
</style></head><body>
<div class="row">
  <div class="card accent-coral"><span class="tag" style="background:var(--d20-coral-light);color:var(--d20-coral-dark)">Activities</span><h4>Sensory bin</h4><p>10 min · ages 2–3 · fine-motor</p></div>
  <div class="card accent-teal"><span class="tag" style="background:var(--d20-teal-light);color:var(--d20-teal-dark)">Toys</span><h4>Stacking rings</h4><p>Cause & effect · 8–14 months</p></div>
  <div class="card accent-purple"><span class="tag" style="background:var(--d20-purple-light);color:var(--d20-purple-dark)">Stories</span><h4>The Patient Fox</h4><p>Bedtime · patience · 3+</p></div>
</div>
</body></html>
