<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--d20-font-display)}
.cta{background:var(--d20-teal);border-radius:24px;padding:32px;text-align:center;color:#fff;position:relative;overflow:hidden}
.blob{position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.b1{width:140px;height:140px;top:-40px;right:-30px}
.b2{width:90px;height:90px;bottom:-20px;left:18%}
h3{margin:0 0 6px;font-size:22px;font-weight:900;position:relative}
p{margin:0 0 16px;font-size:13px;opacity:.9;position:relative}
button{position:relative;background:#fff;color:var(--d20-teal-dark);font-family:inherit;font-weight:800;font-size:14px;padding:12px 28px;border-radius:14px;border:none;cursor:pointer}
</style></head><body>
<div class="cta">
  <div class="blob b1"></div><div class="blob b2"></div>
  <h3>Join thousands of mothers</h3>
  <p>Personalised activities, stories &amp; experts — matched to your child's age.</p>
  <button>Start for free →</button>
</div>
</body></html>
