<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--d20-font-display)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.pair{display:flex;flex-direction:column;gap:0}
.tint{height:54px;border-radius:14px 14px 0 0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--d20-grey-70)}
.dark{height:34px;border-radius:0 0 14px 14px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;letter-spacing:.05em}
.lbl{font-size:11px;font-weight:800;color:var(--d20-grey-90);margin-top:8px;text-align:center}
</style></head><body>
<div class="grid">
  <div class="pair"><div class="tint" style="background:var(--d20-teal-light)">Light</div><div class="dark" style="background:var(--d20-teal-dark)">Dark</div><div class="lbl">Teal</div></div>
  <div class="pair"><div class="tint" style="background:var(--d20-yellow-light)">Light</div><div class="dark" style="background:var(--d20-yellow-dark)">Dark</div><div class="lbl">Yellow</div></div>
  <div class="pair"><div class="tint" style="background:var(--d20-purple-light)">Light</div><div class="dark" style="background:var(--d20-purple-dark)">Dark</div><div class="lbl">Purple</div></div>
  <div class="pair"><div class="tint" style="background:var(--d20-coral-light)">Light</div><div class="dark" style="background:var(--d20-coral-dark)">Dark</div><div class="lbl">Coral</div></div>
  <div class="pair"><div class="tint" style="background:var(--d20-green-light)">Light</div><div class="dark" style="background:var(--d20-green-dark)">Dark</div><div class="lbl">Green</div></div>
</div>
</body></html>
