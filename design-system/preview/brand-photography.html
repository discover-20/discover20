<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:0;background:#fff;height:280px;font-family:var(--d20-font-display)}
.wrap{display:grid;grid-template-columns:1.4fr 1fr;height:100%}
img{display:block;width:100%;height:100%;object-fit:cover}
.side{padding:24px;display:flex;flex-direction:column;justify-content:center;gap:8px}
h3{margin:0;font-size:18px;color:var(--d20-grey-90);font-weight:900}
p{margin:0;font-size:13px;color:var(--d20-grey-70);line-height:1.65}
ul{margin:6px 0 0;padding:0;list-style:none;font-size:12px;color:var(--d20-grey-70)}
li{position:relative;padding-left:14px;margin-bottom:4px}
li::before{content:'';position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:50%;background:var(--d20-teal)}
</style></head><body>
<div class="wrap">
  <img src="../assets/hero-home.png" alt="mother and toddler with brand icons">
  <div class="side">
    <h3>Photography style</h3>
    <p>Warm-lit moms &amp; toddlers. Cut out, composited over teal pattern with brand line-icons orbiting.</p>
    <ul><li>Natural light, slightly warm cast</li><li>Caregiver + child together</li><li>Icons in all 5 brand colors</li></ul>
  </div>
</div>
</body></html>
