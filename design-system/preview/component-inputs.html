<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--d20-font-display)}
.in{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
label{font-size:12px;font-weight:800;color:var(--d20-grey-90)}
input,select{font-family:inherit;font-size:14px;padding:12px 14px;border-radius:14px;border:1px solid var(--d20-grey-15);background:#fff;color:var(--d20-grey-90);outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--d20-teal);box-shadow:0 0 0 3px rgba(26,187,188,.18)}
.hint{font-size:11px;color:var(--d20-grey-50)}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--d20-grey-90);font-weight:600}
.check input{width:18px;height:18px;accent-color:var(--d20-teal)}
</style></head><body>
<div class="in"><label>Your child's name</label><input value="Yara"></div>
<div class="in"><label>Age range</label><select><option>1–2 years</option><option>2–3 years</option></select></div>
<label class="check"><input type="checkbox" checked> Send me weekly activity ideas</label>
</body></html>
