<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--d20-font-display)}
.row{display:flex;flex-direction:column;gap:10px}
.line{display:flex;align-items:baseline;gap:14px}
.swatch{width:14px;height:14px;border-radius:4px;flex:none}
.role{font-size:11px;color:var(--d20-grey-50);font-weight:700;letter-spacing:.08em;text-transform:uppercase;width:80px}
</style></head><body>
<div class="row">
  <div class="line"><span class="swatch" style="background:var(--d20-coral)"></span><span class="role">Title</span><span style="font-size:26px;font-weight:900;color:var(--d20-coral)">Young Secrets</span></div>
  <div class="line"><span class="swatch" style="background:var(--d20-teal)"></span><span class="role">Subtitle</span><span style="font-size:18px;font-weight:600;color:var(--d20-teal)">Great solutions for moms</span></div>
  <div class="line"><span class="swatch" style="background:var(--d20-grey-70)"></span><span class="role">Body</span><span style="font-size:15px;color:var(--d20-grey-70)">We turn 20 minutes into a guided journey of play.</span></div>
  <div class="line"><span class="swatch" style="background:var(--d20-black)"></span><span class="role">Data</span><span style="font-size:24px;font-weight:900;color:var(--d20-black);letter-spacing:-.02em">+500</span></div>
</div>
</body></html>
