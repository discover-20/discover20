<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--d20-font-display)}
.row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.box{display:flex;flex-direction:column;align-items:center;gap:6px}
.shape{width:78px;height:78px;background:var(--d20-teal);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:11px}
.t{font-size:10px;color:var(--d20-grey-70);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
</style></head><body>
<div class="row">
  <div class="box"><div class="shape" style="border-radius:var(--d20-r-sm)">8</div><div class="t">sm</div></div>
  <div class="box"><div class="shape" style="border-radius:var(--d20-r-md);background:var(--d20-coral)">14</div><div class="t">md · buttons</div></div>
  <div class="box"><div class="shape" style="border-radius:var(--d20-r-lg);background:var(--d20-purple)">18</div><div class="t">lg · cards</div></div>
  <div class="box"><div class="shape" style="border-radius:var(--d20-r-xl);background:var(--d20-green)">24</div><div class="t">xl · heroes</div></div>
  <div class="box"><div class="shape" style="border-radius:var(--d20-r-2xl);background:var(--d20-yellow);color:var(--d20-black)">32</div><div class="t">2xl</div></div>
  <div class="box"><div class="shape" style="border-radius:48px 48px 12px 12px;background:var(--d20-teal-dark)">48↓</div><div class="t">hero cut</div></div>
  <div class="box"><div class="shape" style="border-radius:999px;background:var(--d20-coral)">∞</div><div class="t">pill</div></div>
</div>
</body></html>
