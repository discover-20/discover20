<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--d20-font-display)}
.scale{display:flex;gap:0;border-radius:12px;overflow:hidden;box-shadow:var(--d20-shadow-sm);height:64px}
.step{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:700;font-family:ui-monospace,monospace}
.l{color:var(--d20-grey-70)}
.d{color:#fff}
.lbl{margin-top:14px;font-size:12px;color:var(--d20-grey-70);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
</style></head><body>
<div class="lbl">Neutrals</div>
<div class="scale" style="margin-top:6px">
  <div class="step l" style="background:var(--d20-white);box-shadow:inset 0 0 0 1px var(--d20-grey-15)">white</div>
  <div class="step l" style="background:var(--d20-grey-04)">04</div>
  <div class="step l" style="background:var(--d20-grey-08)">08</div>
  <div class="step l" style="background:var(--d20-grey-15)">15</div>
  <div class="step l" style="background:var(--d20-grey-30)">30</div>
  <div class="step d" style="background:var(--d20-grey-50)">50</div>
  <div class="step d" style="background:var(--d20-grey-70)">70</div>
  <div class="step d" style="background:var(--d20-grey-90)">90</div>
  <div class="step d" style="background:var(--d20-black)">black</div>
</div>
</body></html>
