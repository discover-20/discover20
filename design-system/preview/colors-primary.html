<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--d20-font-display)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{aspect-ratio:1;border-radius:16px;display:flex;align-items:flex-end;padding:10px;color:#fff;font-weight:900;font-size:12px;letter-spacing:.02em}
.chip.dark{color:var(--d20-black)}
.name{font-size:12px;font-weight:800;color:var(--d20-grey-90)}
.hex{font-size:11px;color:var(--d20-grey-50);font-family:ui-monospace,monospace}
</style></head><body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:var(--d20-teal)">Teal</div><div class="name">Primary</div><div class="hex">#1ABBBC</div></div>
  <div class="sw"><div class="chip dark" style="background:var(--d20-yellow)">Yellow</div><div class="name">Accent</div><div class="hex">#FFD545</div></div>
  <div class="sw"><div class="chip" style="background:var(--d20-purple)">Purple</div><div class="name">Stories</div><div class="hex">#5A30CE</div></div>
  <div class="sw"><div class="chip" style="background:var(--d20-coral)">Coral</div><div class="name">Activities</div><div class="hex">#F05E5E</div></div>
  <div class="sw"><div class="chip" style="background:var(--d20-green)">Green</div><div class="name">Toys</div><div class="hex">#86C559</div></div>
</div>
</body></html>
