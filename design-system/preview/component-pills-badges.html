<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--d20-font-display)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700}
.dot{width:7px;height:7px;border-radius:50%}
.badge{border-radius:12px;padding:5px 12px;font-size:11px;font-weight:800;letter-spacing:.05em;display:inline-flex;align-items:center;gap:6px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--d20-grey-70);display:inline-flex;align-items:center;gap:8px}
.eyebrow .dot{width:9px;height:9px}
</style></head><body>
<div style="display:flex;flex-direction:column;gap:16px">
  <div class="row">
    <span class="pill" style="background:var(--d20-teal-light);color:var(--d20-teal-dark)"><span class="dot" style="background:var(--d20-teal)"></span>0–6 mo</span>
    <span class="pill" style="background:var(--d20-coral-light);color:var(--d20-coral-dark)"><span class="dot" style="background:var(--d20-coral)"></span>6–12 mo</span>
    <span class="pill" style="background:var(--d20-yellow-light);color:#92700A"><span class="dot" style="background:var(--d20-yellow)"></span>1–2 yrs</span>
    <span class="pill" style="background:var(--d20-purple-light);color:var(--d20-purple-dark)"><span class="dot" style="background:var(--d20-purple)"></span>2–3 yrs</span>
    <span class="pill" style="background:var(--d20-green-light);color:var(--d20-green-dark)"><span class="dot" style="background:var(--d20-green)"></span>3–4 yrs</span>
  </div>
  <div class="row">
    <span class="badge" style="background:rgba(26,187,188,.15);color:var(--d20-teal-dark)">Free Trial</span>
    <span class="badge" style="background:var(--d20-coral);color:#fff">NEW</span>
    <span class="badge" style="background:var(--d20-yellow);color:var(--d20-black)">Recommended</span>
    <span class="eyebrow"><span class="dot" style="background:var(--d20-coral)"></span>Vision &amp; Mission</span>
  </div>
</div>
</body></html>
