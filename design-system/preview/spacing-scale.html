<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--d20-font-display)}
.row{display:flex;gap:0;align-items:flex-end}
.tok{display:flex;flex-direction:column;align-items:center;flex:1}
.bar{background:var(--d20-teal);border-radius:6px;width:14px}
.lbl{font-size:10px;color:var(--d20-grey-50);font-weight:700;margin-top:8px;font-family:ui-monospace,monospace}
.px{font-size:10px;color:var(--d20-grey-70);font-weight:800;margin-top:2px}
</style></head><body>
<div class="row">
  <div class="tok"><div class="bar" style="height:4px"></div><div class="lbl">s-1</div><div class="px">4</div></div>
  <div class="tok"><div class="bar" style="height:8px;background:var(--d20-teal)"></div><div class="lbl">s-2</div><div class="px">8</div></div>
  <div class="tok"><div class="bar" style="height:12px;background:var(--d20-teal)"></div><div class="lbl">s-3</div><div class="px">12</div></div>
  <div class="tok"><div class="bar" style="height:16px;background:var(--d20-teal)"></div><div class="lbl">s-4</div><div class="px">16</div></div>
  <div class="tok"><div class="bar" style="height:24px;background:var(--d20-teal)"></div><div class="lbl">s-5</div><div class="px">24</div></div>
  <div class="tok"><div class="bar" style="height:32px;background:var(--d20-teal)"></div><div class="lbl">s-6</div><div class="px">32</div></div>
  <div class="tok"><div class="bar" style="height:48px;background:var(--d20-teal)"></div><div class="lbl">s-7</div><div class="px">48</div></div>
  <div class="tok"><div class="bar" style="height:64px;background:var(--d20-teal)"></div><div class="lbl">s-8</div><div class="px">64</div></div>
  <div class="tok"><div class="bar" style="height:96px;background:var(--d20-teal)"></div><div class="lbl">s-9</div><div class="px">96</div></div>
</div>
</body></html>
