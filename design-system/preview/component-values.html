<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--d20-font-display)}
.row{display:flex;gap:12px;align-items:stretch}
.val{flex:1;display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--d20-grey-15);border-radius:16px;padding:14px}
.num{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:13px;flex:none}
h4{margin:0 0 2px;font-size:13px;font-weight:800;color:var(--d20-grey-90)}
p{margin:0;font-size:11px;color:var(--d20-grey-70);line-height:1.55}
</style></head><body>
<div class="row">
  <div class="val"><div class="num" style="background:var(--d20-teal)">01</div><div><h4>Integrity</h4><p>Honesty, transparency, responsibility.</p></div></div>
  <div class="val"><div class="num" style="background:var(--d20-coral)">02</div><div><h4>Empathy</h4><p>We design for real moms, with care.</p></div></div>
  <div class="val"><div class="num" style="background:var(--d20-purple)">03</div><div><h4>Responsibility</h4><p>Experiences that truly benefit.</p></div></div>
  <div class="val"><div class="num" style="background:var(--d20-yellow);color:var(--d20-black)">04</div><div><h4>Companionship</h4><p>Mom never feels alone in the journey.</p></div></div>
</div>
</body></html>
